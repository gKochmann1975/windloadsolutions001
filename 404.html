<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" href="/favicon.ico">
    <title>Page Not Found | WindLoadCalc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0018ff 0%, #181E57 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #181E57;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #181E57;
            margin-bottom: 1rem;
        }
        .error-message {
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .redirect-notice {
            background: #eff6ff;
            border-left: 4px solid #0018ff;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: left;
            display: none;
        }
        .redirect-notice.active {
            display: block;
        }
        .redirect-notice p {
            color: #1e40af;
            font-size: 0.9rem;
        }
        .redirect-notice strong {
            display: block;
            margin-bottom: 0.5rem;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0018ff 0%, #181E57 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 24, 255, 0.3);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #181E57;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .helpful-links {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }
        .helpful-links h3 {
            font-size: 1rem;
            color: #181E57;
            margin-bottom: 1rem;
        }
        .helpful-links ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .helpful-links a {
            color: #0018ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .helpful-links a:hover {
            text-decoration: underline;
        }
        @media (max-width: 640px) {
            .container {
                padding: 2rem;
            }
            .error-code {
                font-size: 4rem;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
    <script>
        // Legacy URL redirects - handle old PHP URLs
        const redirectMap = {
            '/index.php': '/index.html',
            '/products.php': '/wind-load-calculator-shop.html',
            '/faqs.php': '/faq.html',
            '/demos.php': '/demo.html',
            '/service-area/wind-load-analysis-idaho/': '/wind-load-calculator-shop.html'
        };

        // Get current path
        const currentPath = window.location.pathname;

        // Check for redirects
        for (const [oldPath, newPath] of Object.entries(redirectMap)) {
            if (currentPath === oldPath || currentPath.endsWith(oldPath)) {
                // Show redirect notice and redirect
                document.addEventListener('DOMContentLoaded', function() {
                    const notice = document.querySelector('.redirect-notice');
                    if (notice) {
                        notice.classList.add('active');
                        notice.querySelector('.old-url').textContent = oldPath;
                        notice.querySelector('.new-url').textContent = newPath;
                    }
                });
                // Redirect after short delay
                setTimeout(function() {
                    window.location.href = newPath;
                }, 100);
                break;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for doesn't exist or has been moved.
            Don't worry - let's get you back on track.
        </p>

        <div class="redirect-notice">
            <p>
                <strong>Redirecting you automatically...</strong>
                The URL <code class="old-url"></code> has moved to <code class="new-url"></code>
            </p>
        </div>

        <div class="btn-group">
            <a href="/index.html" class="btn btn-primary">Go to Homepage</a>
            <a href="/wind-load-calculator-shop.html" class="btn btn-secondary">View Calculators</a>
        </div>

        <div class="helpful-links">
            <h3>Popular Pages</h3>
            <ul>
                <li><a href="/building-intelligence-platform.html">BIP Platform</a></li>
                <li><a href="/wind-load-calculator-shop.html">Wind Load Calculators</a></li>
                <li><a href="/faq.html">FAQ</a></li>
                <li><a href="/contact.html">Contact Us</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
