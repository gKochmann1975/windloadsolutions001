<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Build your WindLoadCalc plan — pick the ASCE 7-22 calculators you need. The more you add, the less each one costs.">
<title>Build Your Plan — WindLoadCalc</title>
<style>
  :root{
    /* committed dark-immersive (matches the shop pages) */
    --bg:#070a16;
    --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.03);
    --ink:#eef2fb; --muted:#a3aec8; --faint:#727e9a;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
    --accent:#6b86ff; --rev:#34d399; --marg:#f5a83f; --bip:#2dd4bf; --complete:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5); --r:14px;
  }
  /* multi-color aurora — one blob per calculator brand color ("every calculator in one plan") */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;filter:blur(95px);opacity:.5}
  .aurora .a1{width:560px;height:560px;background:#2f4bff;top:-160px;left:-120px;opacity:.5;animation:drift1 22s ease-in-out infinite alternate}
  .aurora .a2{width:520px;height:520px;background:#0018FF;bottom:-180px;right:-140px;opacity:.4;animation:drift2 26s ease-in-out infinite alternate}
  .aurora .a3{width:480px;height:480px;background:#3a5bff;top:26%;right:8%;opacity:.42;animation:drift1 28s ease-in-out infinite alternate-reverse}
  .aurora .a4{width:460px;height:460px;background:#181E57;bottom:6%;left:4%;opacity:.55;animation:drift2 24s ease-in-out infinite alternate}
  .aurora .a5{width:400px;height:400px;background:#4666ff;top:4%;left:44%;opacity:.4;animation:drift1 30s ease-in-out infinite alternate}
  .aurora .a6{width:320px;height:320px;background:#6b86ff;top:54%;left:50%;opacity:.3;animation:drift2 32s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(70px,55px) scale(1.12)}}
  @keyframes drift2{to{transform:translate(-60px,-45px) scale(1.1)}}
  .gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:56px 56px;mask-image:radial-gradient(ellipse 82% 62% at 50% 0%,#000 42%,transparent 100%)}
  @media (prefers-reduced-motion:reduce){.aurora span{animation:none}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}
  .card,.summary,.seg,.bip{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .pvbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:#aebdff;background:color-mix(in srgb,#3a5bff 18%,transparent);border:1px solid color-mix(in srgb,#3a5bff 42%,transparent);padding:4px 11px;border-radius:20px;margin-bottom:14px}
  h1{font-size:clamp(21px,2.5vw,28px);letter-spacing:-.02em;margin:0 0 4px;font-weight:760;text-wrap:balance}
  .sub{color:var(--muted);margin:0;font-size:14.5px;max-width:64ch}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 18px}
  .seg{display:flex;gap:4px;background:#fff;border:1px solid rgba(255,255,255,.55);border-radius:11px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .seg button{border:0;background:transparent;color:#181E57;font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button:hover{color:#0018FF}
  .seg button.on{background:#0018FF;color:#fff;box-shadow:0 2px 10px rgba(0,24,255,.45)}
  .seg .savepill{font-size:10.5px;font-weight:700;color:var(--rev);margin-left:5px}
  .seg button.on .savepill{color:#d6ffe9}

  .layout{display:grid;grid-template-columns:1fr 370px;gap:30px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}

  /* calc cards */
  .cards{display:flex;flex-direction:column;gap:15px}
  .card{display:flex;align-items:center;gap:17px;border:1.5px solid color-mix(in srgb,var(--ac,var(--accent)) 32%,var(--line));
    background:linear-gradient(135deg,color-mix(in srgb,var(--ac,var(--accent)) 26%,transparent),color-mix(in srgb,var(--ac,var(--accent)) 7%,transparent)),var(--panel);
    border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:border-color .18s,transform .12s,box-shadow .18s;box-shadow:var(--shadow)}
  .card:hover{transform:translateY(-1px)}
  .card.on{border-color:var(--ac,var(--accent));background:linear-gradient(135deg,color-mix(in srgb,var(--ac,var(--accent)) 42%,transparent),color-mix(in srgb,var(--ac,var(--accent)) 13%,transparent)),var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac,var(--accent)) 22%,transparent),var(--shadow)}
  .card.soon{opacity:.72;cursor:not-allowed}
  .tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:#fff;transition:.15s}
  .card.on .tick{background:var(--ac,var(--accent));border-color:var(--ac,var(--accent))}
  .card .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:linear-gradient(140deg,var(--ac,var(--accent)),color-mix(in srgb,var(--ac,var(--accent)) 66%,#000));border:1px solid rgba(255,255,255,.24);
    box-shadow:0 6px 16px color-mix(in srgb,var(--ac,var(--accent)) 34%,transparent);
    animation:iconFloat 5.5s ease-in-out infinite;transition:box-shadow .35s}
  .card .ic svg{width:24px;height:24px;stroke:#fff;fill:none;transition:transform .4s cubic-bezier(.22,.61,.36,1)}
  .card:hover .ic{box-shadow:0 10px 24px color-mix(in srgb,var(--ac,var(--accent)) 38%,transparent)}
  .card:hover .ic svg{transform:scale(1.18) rotate(-6deg)}
  .card.soon .ic{animation:none}
  .card:nth-child(2) .ic{animation-delay:.5s} .card:nth-child(3) .ic{animation-delay:1s}
  .card:nth-child(4) .ic{animation-delay:1.5s} .card:nth-child(5) .ic{animation-delay:2s} .card:nth-child(6) .ic{animation-delay:2.5s}
  @keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.card .ic{animation:none} .card:hover .ic svg{transform:none}}
  .tick svg{width:15px;height:15px;opacity:0;transition:.15s}
  .card.on .tick svg{opacity:1}
  .cbody{flex:1;min-width:0}
  .cbody h3{margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.01em}
  .cbody p{margin:2px 0 0;font-size:12.8px;color:var(--muted)}
  .cact{flex:0 0 auto;text-align:right}
  .cact .add{font-size:14.5px;font-weight:750;color:var(--marg);white-space:nowrap}
  .cact .in{font-size:13px;font-weight:700;color:var(--rev)}
  .cact .soonlab{font-size:12px;font-weight:700;color:var(--faint)}
  .cact small{display:block;font-size:11px;color:var(--faint);font-weight:600}

  /* BIP row */
  .bip{display:flex;align-items:center;gap:13px;border:1.5px dashed var(--bip);border-radius:var(--r);padding:14px 16px;
    background:color-mix(in srgb,var(--bip) 7%,var(--panel));cursor:pointer;transition:.15s}
  .bip.on{background:color-mix(in srgb,var(--bip) 15%,var(--panel));border-style:solid}
  .bip.free{border-color:var(--rev);background:color-mix(in srgb,var(--rev) 12%,var(--panel));cursor:default}
  .bip .tick{border-color:var(--bip)} .bip.on .tick{background:var(--bip);border-color:var(--bip)}
  .bip h3{font-size:14.5px;margin:0;font-weight:680} .bip p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .bip .price{font-weight:750;color:var(--bip);white-space:nowrap} .bip.free .price{color:var(--rev)}

  /* summary */
  .summary{position:sticky;top:16px;border-radius:var(--r);padding:24px 22px;display:flex;flex-direction:column;gap:16px;
    /* scoped light tokens -> dark text on white, brand-blue accents, ZERO purple */
    --ink:#0f1730;--muted:#4a5573;--faint:#8794ad;--panel2:#eef2fc;--line:#dfe5f3;--accent:#2f4bff;--complete:#0018FF;--bip:#0e7490;--rev:#0a8f5b;
    background:linear-gradient(160deg,#ffffff 0%,#e9f0ff 100%);border:1px solid rgba(255,255,255,.65);
    box-shadow:0 12px 34px rgba(3,10,40,.5);transition:box-shadow .3s}
  .summary:hover{box-shadow:0 18px 46px rgba(3,10,40,.6)}
  @media (max-width:860px){.summary{position:static}}
  .sumhead{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .pricebig{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .pricebig .now{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
  .pricebig .unit{font-size:14px;color:var(--muted);font-weight:600}
  .pricebig .was{font-size:16px;color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
  .savebadge{align-self:flex-start;font-size:12.5px;font-weight:750;color:var(--rev);background:color-mix(in srgb,var(--rev) 13%,transparent);
    padding:5px 11px;border-radius:20px}
  .savemore{font-size:13px;color:var(--muted);line-height:1.5}
  .savemore b{color:var(--ink)}

  .progress{display:flex;flex-direction:column;gap:7px}
  .plabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .plabel b{color:var(--ink)}
  .track{height:9px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--complete));transition:width .35s cubic-bezier(.4,0,.2,1)}
  .nudge{font-size:12.8px;color:var(--complete);font-weight:600;line-height:1.45}
  .nudge.complete{color:var(--rev)}

  .cta{border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent),#4666ff);color:#fff;font:inherit;
    font-weight:750;font-size:15.5px;padding:14px;cursor:pointer;transition:.2s;width:100%}
  .cta:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(47,75,255,.4)}
  .cta:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .finenote{font-size:11.5px;color:var(--faint);text-align:center;margin:-4px 0 0}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:8px 0}
  .previewnote{margin-top:26px;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px;max-width:80ch}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span><span class="a5"></span><span class="a6"></span></div>
<div class="gridbg" aria-hidden="true"></div>
<div class="wrap">
  <span class="pvbadge">ASCE 7‑22 · Volume pricing</span>
  <h1>Build your plan</h1>
  <p class="sub">Pick the calculators you need. The more you add, the less each one costs — and every calculator you add is cheaper than the last.</p>

  <div class="toolbar">
    <div class="seg" id="tier">
      <button data-t="starter" class="on">Starter</button>
      <button data-t="pro">Pro</button>
      <button data-t="premium">Premium</button>
    </div>
    <div class="seg" id="cycle">
      <button data-c="monthly" class="on">Monthly</button>
      <button data-c="annual">Annual<span class="savepill">2 mo free</span></button>
    </div>
  </div>

  <div class="layout">
    <div class="cards" id="cards"></div>

    <aside class="summary" id="summary">
      <div class="sumhead">Your plan</div>
      <div id="sumbody"></div>
    </aside>
  </div>

  <p class="previewnote" id="pnote"></p>
</div>

<script src="js/pricing-engine.js"></script>
<script>
(function(){
  "use strict";
  if(!window.WLCPricing){ document.getElementById("cards").innerHTML="<p class='empty'>Pricing engine failed to load (js/pricing-engine.js).</p>"; return; }
  var P = window.WLCPricing;
  var COLORS = { wd:"#06b6d4", mwfrs:"#3b82f6", roofs:"#f97316", other:"#14b8a6", specialty:"#a855f7", solar:"#fbbf24" };
  var ICONS = {
    wd:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>',
    mwfrs:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="9" y1="22" x2="9" y2="12"/><line x1="15" y1="22" x2="15" y2="12"/></svg>',
    roofs:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    other:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3v18"/><path d="M7 8a7 7 0 0 1 10 0"/><path d="M9.5 11a3.5 3.5 0 0 1 5 0"/><path d="M9 21l3-6 3 6"/></svg>',
    specialty:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    solar:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M3 5l16-1.6v8L3 13z"/><path d="M3 8.8l16-1M9 4.15v8.45M14 3.7v8.9"/><path d="M11 13v6M7.5 19.5h7M2 22h20"/></svg>'
  };
  var DESC = {
    wd:"C&C openings — windows, doors, shutters, mulled assemblies",
    mwfrs:"Whole‑building — Directional + Envelope",
    roofs:"Every roof shape, plus parapets & overhangs",
    other:"Signs, walls, equipment, chimneys, tanks & trussed towers",
    specialty:"Parapets + attached canopies",
    solar:"Rooftop + ground‑mount PV — coming soon"
  };
  var state = { tier:"starter", cycle:"monthly", selected:{}, bip:false };
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';

  function money(v){ return "$"+Math.round(v).toLocaleString(); }
  function unit(){ return state.cycle==="annual" ? "/yr" : "/mo"; }
  function selectedIds(){ return P.config().catalog.filter(function(c){return state.selected[c.id];}).map(function(c){return c.id;}); }

  function q(){ return P.quote({ owned:[], selected:selectedIds(), tier:state.tier, cycle:state.cycle, bipSelected:state.bip }); }

  function renderCards(){
    var Q = q(), cat = P.config().catalog, h="";
    cat.forEach(function(c){
      var on = !!state.selected[c.id];
      var soon = !c.live;
      var act;
      if(soon) act = '<span class="soonlab">Soon</span>';
      else if(on) act = '<span class="in">✓ In your plan</span>';
      else act = '<span class="add">Add +'+money(Q.addNextPrice)+'</span><small>'+unit().slice(1)+'</small>';
      h+='<div class="card'+(on?' on':'')+(soon?' soon':'')+'" data-id="'+c.id+'" style="--ac:'+(COLORS[c.id]||'var(--accent)')+'"'+(soon?'':' tabindex="0" role="button" aria-pressed="'+on+'"')+'>'+
           '<div class="tick">'+CHECK+'</div>'+
           '<div class="ic">'+(ICONS[c.id]||'')+'</div>'+
           '<div class="cbody"><h3>'+c.name+'</h3><p>'+(DESC[c.id]||"")+'</p></div>'+
           '<div class="cact">'+act+'</div>'+
         '</div>';
    });
    document.getElementById("cards").innerHTML = h;
  }

  function renderSummary(){
    var Q = q(), sel = selectedIds();
    var b = document.getElementById("sumbody");
    if(sel.length===0){ b.innerHTML='<p class="empty">Select a calculator to start. Your first is '+money(P.curveTotal(1,{tier:state.tier,cycle:state.cycle}))+unit()+'.</p>'; return; }

    var h="";
    // price block
    h+='<div class="pricebig"><span class="now">'+money(Q.newTotal)+'</span><span class="unit">'+unit()+'</span>';
    if(Q.savings>0) h+='<span class="was">'+money(Q.separatePrice)+unit()+'</span>';
    h+='</div>';
    if(Q.savings>0) h+='<div class="savebadge">You save '+money(Q.savings)+unit()+' · '+Q.savingsPct+'% off</div>';

    // save-more line
    if(Q.showSaveMore) h+='<div class="savemore"><b>Add more, save more.</b> Each calculator you add now costs less than the last'+(Q.remainingToComplete>0?' — your next is just <b>+'+money(Q.addNextPrice)+unit()+'</b>.':'.')+'</div>';

    // progress to complete
    h+='<div class="progress"><div class="plabel"><span>Plan coverage</span><span><b>'+Q.afterCount+'</b> of '+Q.catalogLive+' calculators</span></div>'+
       '<div class="track"><div class="fill" style="width:'+Math.round(Q.afterCount/Q.catalogLive*100)+'%"></div></div>';
    if(Q.isComplete) h+='<div class="nudge complete">✓ Complete — every calculator, plus BIP included free.</div>';
    else if(Q.showCompleteNudge) h+='<div class="nudge">You’re '+Q.remainingToComplete+' away from <b>Complete</b> — get all '+Q.catalogLive+' + BIP free for just <b>+'+money(Q.completeDelta - (Q.newTotal-Q.currentTotal))+unit()+'</b> more.</div>';
    h+='</div>';

    // BIP row (renders after summary via separate node) -> include inline here
    if(Q.isComplete){
      h+='<div class="bip free"><div class="tick">'+CHECK+'</div><div class="cbody"><h3>Building Intelligence Platform</h3><p>Included free with Complete.</p></div><div class="price">FREE</div></div>';
    } else if(Q.showBipOffer){
      h+='<div class="bip'+(state.bip?' on':'')+'" id="bipRow" tabindex="0" role="button" aria-pressed="'+state.bip+'"><div class="tick">'+CHECK+'</div>'+
         '<div class="cbody"><h3>Add full BIP access</h3><p>Hurricane risk, solar siting, multi‑criteria search across 40,000+ ZIPs.</p></div>'+
         '<div class="price">+'+money(Q.bipPrice)+unit()+'</div></div>';
    }

    // CTA
    h+='<button class="cta" id="cta">Checkout — '+money(Q.dueWithBip)+unit()+'</button>';
    h+='<p class="finenote">'+(state.cycle==="annual"?'Billed yearly (2 months free).':'Billed monthly.')+' Cancel anytime.</p>';

    b.innerHTML=h;
  }

  function render(){ renderCards(); renderSummary(); document.getElementById("pnote").textContent =
    "Every calculator is ASCE 7-22. Secure checkout by Stripe · cancel anytime · 7-day free trial. Already have a plan? Add calculators from inside your account and keep your volume price."; }

  // events (delegated)
  document.getElementById("cards").addEventListener("click", function(e){ toggleCard(e.target.closest(".card")); });
  document.getElementById("cards").addEventListener("keydown", function(e){ if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){ e.preventDefault(); toggleCard(e.target); }});
  function toggleCard(card){ if(!card||card.classList.contains("soon")) return; var id=card.dataset.id; if(state.selected[id]) delete state.selected[id]; else state.selected[id]=true; render(); }

  document.getElementById("summary").addEventListener("click", function(e){
    if(e.target.closest("#bipRow")){ state.bip=!state.bip; render(); }
    else if(e.target.closest("#cta")){
      var btn=e.target.closest("#cta"); if(btn.disabled) return;
      var label=btn.textContent; btn.disabled=true; btn.textContent="Starting secure checkout…";
      fetch("https://api.windloadcalc.com/api/subscriptions/checkout-curve",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ programs:selectedIds(), tier:state.tier, cycle:state.cycle, bip:state.bip })
      }).then(function(r){return r.json();}).then(function(d){
        if(d && d.checkout_url){ window.location.href=d.checkout_url; }
        else { btn.disabled=false; btn.textContent=label; alert((d&&d.error)||"Could not start checkout — please try again."); }
      }).catch(function(){ btn.disabled=false; btn.textContent=label; alert("Network error — please try again."); });
    }
  });

  function segWire(id,key,attr){ document.getElementById(id).addEventListener("click",function(e){ var btn=e.target.closest("button"); if(!btn) return;
    [].forEach.call(this.querySelectorAll("button"),function(x){x.classList.remove("on");}); btn.classList.add("on"); state[key]=btn.dataset[attr]; render(); }); }
  segWire("tier","tier","t"); segWire("cycle","cycle","c");


  render();
})();
</script>
</body>
</html>
