<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Download your files from WindLoadCalc.com">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" href="/favicon.ico">
    <title>Download Your Files - WindLoadCalc</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0018ff 0%, #181E57 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .download-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            padding: 48px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.6s ease-out 0.2s both;
        }

        .header-icon.ready {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .header-icon.pending {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .header-icon.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .header-icon svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        h1 {
            color: #1e293b;
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 32px;
            line-height: 1.6;
            text-align: center;
        }

        .description {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            text-align: center;
        }

        .description p {
            margin: 0;
            color: #0369a1;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .file-list {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .file-list-header {
            background: #f8fafc;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .file-list-header span {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.15s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: #f8fafc;
        }

        .file-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .file-icon.pdf { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .file-icon.html { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .file-icon.xls, .file-icon.xlsx { background: linear-gradient(135deg, #10b981, #059669); }
        .file-icon.default { background: linear-gradient(135deg, #6366f1, #4f46e5); }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .download-btn {
            background: linear-gradient(135deg, #0018ff 0%, #181E57 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 24, 255, 0.3);
        }

        .download-btn svg {
            width: 16px;
            height: 16px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
        }

        .download-all-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0018ff 0%, #181E57 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0, 24, 255, 0.3);
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 24, 255, 0.4);
        }

        .expiry-notice {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 24px;
        }

        .expiry-notice p {
            margin: 0;
            font-size: 0.85rem;
            color: #92400e;
        }

        .pending-notice {
            text-align: center;
            padding: 40px 20px;
        }

        .pending-notice .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #0018ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pending-notice p {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
        }

        .error-state p {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
        }

        .help-text {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .help-text a {
            color: #0018ff;
            text-decoration: none;
            font-weight: 600;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-state .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #0018ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @media (max-width: 640px) {
            .download-container {
                padding: 32px 20px;
            }
            h1 { font-size: 1.4rem; }
            .file-item { flex-wrap: wrap; gap: 12px; }
            .download-btn { margin-left: 0; width: 100%; justify-content: center; }
            .file-info { min-width: calc(100% - 60px); }
        }
    </style>
</head>
<body>
    <div class="download-container" id="main-container">
        <div class="loading-state" id="loading">
            <div class="spinner"></div>
            <p>Loading your files...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.windloadcalc.com';

        function getFileExtension(filename) {
            return (filename || '').split('.').pop().toLowerCase();
        }

        function getFileIconClass(filename) {
            const ext = getFileExtension(filename);
            if (['pdf'].includes(ext)) return 'pdf';
            if (['html', 'htm'].includes(ext)) return 'html';
            if (['xls', 'xlsx', 'xlsm'].includes(ext)) return 'xls';
            return 'default';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(0) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function formatDate(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function renderError(title, message) {
            document.getElementById('main-container').innerHTML = `
                <div class="header-icon error">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                </div>
                <h1>${title}</h1>
                <div class="error-state">
                    <p>${message}</p>
                </div>
                <div class="help-text">
                    <p>Need help? Contact <a href="mailto:support@windloadcalc.com">support@windloadcalc.com</a></p>
                </div>
            `;
        }

        function renderPending(data) {
            document.getElementById('main-container').innerHTML = `
                <div class="header-icon pending">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <h1>Your Files Are Being Prepared</h1>
                <p class="subtitle">We're working on your custom files. You'll receive an email at your address when they're ready for download.</p>
                ${data.description ? `<div class="description"><p>${data.description}</p></div>` : ''}
                <div class="pending-notice">
                    <div class="spinner"></div>
                    <p>This page will automatically refresh to check for updates.<br>You can also close this page and use the link from your email when files are ready.</p>
                </div>
                <div class="help-text">
                    <p>Questions? Contact <a href="mailto:support@windloadcalc.com">support@windloadcalc.com</a></p>
                </div>
            `;

            // Auto-refresh every 30 seconds to check if files are ready
            setTimeout(() => window.location.reload(), 30000);
        }

        function renderReady(data, token) {
            let html = `
                <div class="header-icon ready">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </div>
                <h1>Your Files Are Ready</h1>
                <p class="subtitle">${data.customer_name ? `Hi ${data.customer_name}! ` : ''}Your files are ready for download.</p>
            `;

            if (data.description) {
                html += `<div class="description"><p>${data.description}</p></div>`;
            }

            if (data.expires_at) {
                html += `
                    <div class="expiry-notice">
                        <p><strong>Note:</strong> This download link expires on ${formatDate(data.expires_at)}. Please download your files before then.</p>
                    </div>
                `;
            }

            // File list
            html += `<div class="file-list">`;
            html += `<div class="file-list-header"><span>Files (${data.files.length})</span><span>Size</span></div>`;

            for (const file of data.files) {
                const ext = getFileExtension(file.filename);
                const iconClass = getFileIconClass(file.filename);
                const downloadUrl = `${API_URL}/api/download/${token}/files/${file.id}`;

                html += `
                    <div class="file-item">
                        <div class="file-icon ${iconClass}">${ext.toUpperCase()}</div>
                        <div class="file-info">
                            <div class="file-name" title="${file.filename}">${file.filename}</div>
                            <div class="file-meta">${formatFileSize(file.file_size)}</div>
                        </div>
                        <a href="${downloadUrl}" class="download-btn" download>
                            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download
                        </a>
                    </div>
                `;
            }

            html += `</div>`;

            // Download all button (only if multiple files)
            if (data.files.length > 1) {
                html += `<button class="download-all-btn" onclick="downloadAll('${token}', ${JSON.stringify(data.files.map(f => ({id: f.id, filename: f.filename})))})">Download All Files</button>`;
            }

            html += `
                <div class="help-text">
                    <p>Questions about your files? Contact <a href="mailto:support@windloadcalc.com">support@windloadcalc.com</a></p>
                </div>
            `;

            document.getElementById('main-container').innerHTML = html;
        }

        async function downloadAll(token, files) {
            for (const file of files) {
                const url = `${API_URL}/api/download/${token}/files/${file.id}`;
                const link = document.createElement('a');
                link.href = url;
                link.download = file.filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                // Small delay between downloads to prevent browser blocking
                await new Promise(r => setTimeout(r, 500));
            }
        }

        async function loadDelivery() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                renderError('Invalid Link', 'This download link is missing a required token. Please check the link from your email.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/download/${token}`);

                if (response.status === 404) {
                    renderError('Link Not Found', 'This download link is invalid or has been removed. Please check that you have the correct link.');
                    return;
                }

                if (response.status === 410) {
                    renderError('Link Expired', 'This download link has expired. Please contact us if you need your files re-sent.');
                    return;
                }

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'pending' || !data.files || data.files.length === 0) {
                    renderPending(data);
                } else {
                    renderReady(data, token);
                }

            } catch (error) {
                console.error('Failed to load delivery:', error);
                renderError('Something Went Wrong', 'We couldn\'t load your files. Please try again in a moment or contact <a href="mailto:support@windloadcalc.com">support@windloadcalc.com</a>.');
            }
        }

        // Load on page ready
        loadDelivery();
    </script>
</body>
</html>
